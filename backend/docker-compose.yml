# Local development: starts MySQL + the Spring Boot app
# Usage: docker-compose up -d

version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: adaptive-ticket-db
    environment:
      MYSQL_ROOT_PASSWORD: localdev
      MYSQL_DATABASE: adaptive_ticket
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./scripts/seed-data.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: adaptive-ticket-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/adaptive_ticket?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: localdev
      JWT_SECRET: bG9jYWwtZGV2LXNlY3JldC1rZXktZG8tbm90LXVzZS1pbi1wcm9kdWN0aW9u
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
